name: flip_flop
description: Flapper Birds - Daily raffle game with Flappy Bird gameplay.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.7

environment:
  sdk: '>=3.4.4 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

dependencies:
  flutter:
    sdk: flutter
  image: ^4.10.1
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  url_launcher: ^6.1.2
  shared_preferences: ^2.0.7
  confetti: ^0.8.0
  share_plus: ^13.3.0
  cupertino_icons: ^2.0.0

  # ── Firebase (uncomment after running `flutterfire configure`) ──────────────
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.0.0
  google_sign_in: ^6.2.1
  firebase_messaging: ^16.0.0

  # ── Notifications (uncomment to enable local push notifications) ────────────
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0

  # ── Ads (keep or remove as needed) ─────────────────────────────────────────
  google_mobile_ads: ^9.1.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/legacy_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F1428"
  adaptive_icon_foreground: "assets/icon/foreground_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/logo/
    - assets/images/background/
    - assets/images/objects/
    - assets/images/birds/
    - assets/images/birds/char1/
    - assets/images/birds/char2/
    - assets/images/birds/char3/
    - assets/images/birds/char4/
    - assets/images/birds/char5/
    - assets/images/birds/char6/
    - assets/images/birds/char7/
    - assets/images/birds/char8/
    - assets/images/birds/char9/
    - assets/images/birds/char10/
    - assets/images/birds/char11/
    - assets/images/birds/char12/
    - assets/images/birds/char13/
    - assets/images/birds/char14/
    - assets/images/birds/char15/
    - assets/images/birds/char16/
    - assets/images/birds/char17/
    - assets/images/birds/char18/
    - assets/images/birds/char19/
    - assets/images/birds/char20/
    - assets/images/birds/char21/
    - assets/images/birds/char22/
    - assets/images/birds/char23/
    - assets/images/birds/char24/
    - assets/images/birds/char25/
    - assets/images/birds/char26/
    - assets/images/birds/char27/
    - assets/images/birds/char28/
    - assets/images/birds/char29/
    - assets/images/birds/char30/
    - assets/images/birds/char31/
    - assets/images/birds/char32/
    - assets/images/birds/char33/
    - assets/images/birds/char34/
    - assets/images/birds/char35/
    - assets/images/birds/char36/
    - assets/images/birds/explode/
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: DiloWorld
      fonts:
        - asset: assets/fonts/DiloWorld.ttf
    - family: Chainwhacks
      fonts:
        - asset: assets/fonts/Chainwhacks.ttf
          weight: 700
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
